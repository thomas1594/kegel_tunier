version: '3.8'

services:
  kegelturnier:
    build: .
    container_name: kegelturnier-app
    ports:
      - "8501:8501"
    volumes:
      # Volume für die Datenbank - bleibt persistent
      - kegelturnier-data:/app/data
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped

volumes:
  # Named volume für die Datenbank
  kegelturnier-data:
    driver: local
