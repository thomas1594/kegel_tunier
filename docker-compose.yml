services:
  kegelturnier:
    build: .
    container_name: kegelturnier-app
    ports:
      - "8501:8501"
    volumes:
      # Volume for the database and Excel exports - persists across restarts
      - kegelturnier-data:/app/data
    environment:
      - DB_DIR=/app/data
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped

volumes:
  # Named volume for the database
  kegelturnier-data:
    driver: local
